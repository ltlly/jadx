def useMirror = { repo ->
    if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
        def host = repo.url.host
        if (host == 'repo.maven.apache.org' || host == 'repo1.maven.org') {
            repo.setUrl('https://maven.aliyun.com/repository/central')
        } else if (host == 'dl.google.com') {
            repo.setUrl('https://maven.aliyun.com/repository/google')
        } else if (host == 'plugins.gradle.org') {
            repo.setUrl('https://maven.aliyun.com/repository/gradle-plugin')
        }
    }
}
settingsEvaluated { settings ->
    settings.pluginManagement.repositories.configureEach(useMirror)
    settings.dependencyResolutionManagement.repositories.configureEach(useMirror)
}
allprojects {
    repositories.configureEach(useMirror)
    buildscript.repositories.configureEach(useMirror)
}
